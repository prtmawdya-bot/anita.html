<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anita Gina</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; color: white; font-family: sans-serif; }
        #ui { position: absolute; top: 20px; width: 100%; text-align: center; z-index: 10; pointer-events: none; }
        #playBtn { position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%); padding: 15px 30px; border-radius: 30px; border: none; background: #ff4d4d; color: white; cursor: pointer; z-index: 20; pointer-events: auto; }
    </style>
</head>
<body>
    <div id="ui"><h1>Anita & Gina</h1></div>
    <button id="playBtn">Play Music ✨</button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const audio = new Audio('https://tmpfiles.org/wWwXg1b684Eq/ssstikio-1780457311889_okzrx65o.m4a');
        audio.loop = true;
        
        const btn = document.getElementById('playBtn');
        btn.onclick = () => {
            audio.play();
            btn.style.display = 'none';
        };

        // Scene Minimalis buat 3D
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Tambahin objek 3D simpel di sini nanti
        camera.position.z = 5;
        function animate() { requestAnimationFrame(animate); renderer.render(scene, camera); }
        animate();
    </script>
</body>
</html>
