<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Anita Gina ♥</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:#00000c;overflow:hidden;touch-action:none}
  canvas{display:block}

  /* ── title ── */
  #anita{
    position:fixed;top:clamp(14px,3vh,26px);left:50%;
    transform:translateX(-50%);
    font-family:'Georgia',serif;font-style:italic;font-weight:bold;
    font-size:clamp(1.6rem,5vw,3.2rem);
    letter-spacing:.32em;white-space:nowrap;
    color:rgba(255,215,238,0);
    text-shadow:0 0 0 transparent;
    pointer-events:none;z-index:9;
    transition:color 1.5s ease,text-shadow 1.5s ease;
  }
  #anita.show{
    color:rgba(255,218,240,.97);
    text-shadow:
      0 0 16px rgba(255,100,165,.95),
      0 0 42px rgba(255,50,130,.70),
      0 0 85px rgba(200,0,100,.40);
  }

  /* ── play/pause button ── */
  #playBtn{
    position:fixed;
    bottom:clamp(18px,4vh,36px);
    left:50%;transform:translateX(-50%);
    z-index:20;
    background:rgba(255,255,255,0.07);
    border:1.5px solid rgba(255,120,180,0.55);
    color:rgba(255,200,230,0.92);
    font-family:'Georgia',serif;
    font-style:italic;
    font-size:clamp(.75rem,2.2vw,1rem);
    letter-spacing:.18em;
    padding:10px 28px;
    border-radius:50px;
    cursor:pointer;
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    transition:background .3s,border-color .3s,box-shadow .3s;
    user-select:none;
    box-shadow:0 0 18px rgba(255,80,150,.18);
  }
  #playBtn:hover,#playBtn:active{
    background:rgba(255,80,150,0.18);
    border-color:rgba(255,150,200,.9);
    box-shadow:0 0 32px rgba(255,80,150,.45);
  }
  #playBtn .icon{display:inline-block;margin-right:7px;font-style:normal;}

  /* ── hint ── */
  #hint{
    position:fixed;bottom:clamp(60px,10vh,80px);left:50%;
    transform:translateX(-50%);
    color:rgba(255,255,255,.18);font-size:9.5px;
    letter-spacing:2.5px;text-transform:uppercase;
    font-family:'Georgia',serif;pointer-events:none;
    text-align:center;line-height:2;
    transition:opacity 2.5s ease;
  }
  #hint.hide{opacity:0}
</style>
</head>
<body>

<div id="anita">Anita Gina</div>
<div id="hint">drag · rotate &nbsp;|&nbsp; scroll · zoom</div>
<button id="playBtn"><span class="icon">▶</span>Play Music</button>

<!-- Three.js + OrbitControls -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
(function(){
'use strict';

/* ════════════════════════════════════════════════════════════
   AUDIO
═══════════════════════════════════════════════════════════ */
const AUDIO_SRC='https://tmpfiles.org/wiwMgWJ1PMGK/ssstikio-1780457311889_okzrx65o.m4a';
const audio=new Audio();
audio.crossOrigin='anonymous';
audio.src=AUDIO_SRC;
audio.loop=true;
audio.volume=0.72;
audio.preload='none';

let playing=false;
const btn=document.getElementById('playBtn');
const icon=btn.querySelector('.icon');

btn.addEventListener('click',()=>{
  if(!playing){
    audio.play().then(()=>{
      playing=true;
      icon.textContent='⏸';
      btn.childNodes[1].textContent='Pause Music';
    }).catch(()=>{
      // browser blocked – user needs another tap (already handled above)
    });
  } else {
    audio.pause();
    playing=false;
    icon.textContent='▶';
    btn.childNodes[1].textContent='Play Music';
  }
});

/* ════════════════════════════════════════════════════════════
   RENDERER
═══════════════════════════════════════════════════════════ */
const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'low-power'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,1.5));
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setClearColor(0x00000c,1);
document.body.appendChild(renderer.domElement);

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(55,window.innerWidth/window.innerHeight,0.1,3000);
camera.position.set(0,14,72);

const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.dampingFactor=0.06;
controls.rotateSpeed=0.62;
controls.zoomSpeed=0.82;
controls.minDistance=6;
controls.maxDistance=600;
controls.target.set(0,14,0);
controls.update();

window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});

/* ════════════════════════════════════════════════════════════
   TEXTURES  (canvas-drawn, no external image loads)
═══════════════════════════════════════════════════════════ */
function glowDisc(size,c0,c1,c2){
  const cv=document.createElement('canvas');cv.width=cv.height=size;
  const cx=cv.getContext('2d');
  const g=cx.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
  g.addColorStop(0.00,'rgba(255,255,255,1)');
  g.addColorStop(0.07,c0);
  g.addColorStop(0.26,c1);
  g.addColorStop(0.55,c2);
  g.addColorStop(1.00,'rgba(0,0,0,0)');
  cx.fillStyle=g;cx.fillRect(0,0,size,size);
  return new THREE.CanvasTexture(cv);
}

const heartTex = glowDisc(128,
  'rgba(255,110,175,0.98)',
  'rgba(230,20,110,0.55)',
  'rgba(180,0,90,0.08)');

const starTex = glowDisc(64,
  'rgba(200,220,255,0.95)',
  'rgba(120,160,255,0.40)',
  'rgba(60,80,200,0.04)');

/* ════════════════════════════════════════════════════════════
   HEART MATH  (upright – bump at top)
   x = 16 sin³ t
   y = 13 cos t − 5 cos 2t − 2 cos 3t − cos 4t   (no negation → upright)
═══════════════════════════════════════════════════════════ */
function heartXY(t){
  const s=Math.sin(t),c=Math.cos(t);
  return{
    x: 16*s*s*s,
    y: 13*c - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t)
  };
}

function buildLUT(N){
  const pts=[];
  for(let i=0;i<=N;i++) pts.push(heartXY(i/N*Math.PI*2));
  const arc=[0];
  for(let i=1;i<pts.length;i++){
    const dx=pts[i].x-pts[i-1].x,dy=pts[i].y-pts[i-1].y;
    arc.push(arc[i-1]+Math.sqrt(dx*dx+dy*dy));
  }
  return{pts,arc,total:arc[arc.length-1]};
}

function onLUT(lut,u){
  const target=((u%1)+1)%1*lut.total;
  let lo=0,hi=lut.arc.length-1;
  while(lo<hi-1){const m=(lo+hi)>>1;lut.arc[m]<target?lo=m:hi=m;}
  const a=(lut.arc[hi]-lut.arc[lo])<1e-9
    ?0:(target-lut.arc[lo])/(lut.arc[hi]-lut.arc[lo]);
  return{
    x:lut.pts[lo].x+a*(lut.pts[hi].x-lut.pts[lo].x),
    y:lut.pts[lo].y+a*(lut.pts[hi].y-lut.pts[lo].y)
  };
}

const LUT=buildLUT(4000);
const SC=2.6; // world scale

/* ════════════════════════════════════════════════════════════
   HEART PARTICLE SYSTEM  (single BufferGeometry – 1 draw call)
═══════════════════════════════════════════════════════════ */
const OUTLINE_N =2000;
const SPARKLE_N = 340;
const TOTAL     =OUTLINE_N+SPARKLE_N;

const pos   =new Float32Array(TOTAL*3);
const col   =new Float32Array(TOTAL*3);
const phase =new Float32Array(TOTAL);
const baseU =new Float32Array(TOTAL);

function heartCol(u,bright){
  const h=310+Math.sin(u*Math.PI*4+0.4)*38; // 272–348
  const l=(54+Math.sin(u*Math.PI*8)*15)*bright;
  const c=new THREE.Color();
  c.setHSL(h/360,0.96,Math.min(l/100,1));
  return c;
}

// Outline particles
for(let i=0;i<OUTLINE_N;i++){
  const u=i/OUTLINE_N;
  const p=onLUT(LUT,u);
  pos[i*3  ]=p.x*SC;
  pos[i*3+1]=p.y*SC;
  pos[i*3+2]=0;
  const c=heartCol(u,1);
  col[i*3]=c.r;col[i*3+1]=c.g;col[i*3+2]=c.b;
  phase[i]=Math.random()*Math.PI*2;
  baseU[i]=u;
}

// Sparkle particles (scattered near outline)
for(let i=OUTLINE_N;i<TOTAL;i++){
  const u=Math.random();
  const p=onLUT(LUT,u);
  const r=(Math.random()-.5)*1.6;
  const ang=Math.random()*Math.PI*2;
  pos[i*3  ]=p.x*SC+Math.cos(ang)*r;
  pos[i*3+1]=p.y*SC+Math.sin(ang)*r;
  pos[i*3+2]=(Math.random()-.5)*1.4;
  const c=heartCol(u,0.85);
  col[i*3]=c.r;col[i*3+1]=c.g;col[i*3+2]=c.b;
  phase[i]=Math.random()*Math.PI*2;
  baseU[i]=u;
}

const geo=new THREE.BufferGeometry();
geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
geo.setAttribute('color',   new THREE.BufferAttribute(col,3));

const mat=new THREE.PointsMaterial({
  map:heartTex,
  size:2.9,
  vertexColors:true,
  transparent:true,
  opacity:0.93,
  depthWrite:false,
  sizeAttenuation:true,
  alphaTest:0.02,
  blending:THREE.AdditiveBlending,
});

scene.add(new THREE.Points(geo,mat));
const posAttr=geo.attributes.position;

/* ════════════════════════════════════════════════════════════
   GLOW SPRITES  (heart centre bloom – 2 layers)
═══════════════════════════════════════════════════════════ */
function radialSprite(size,stops,blending,opacity,scl,px,py,pz){
  const cv=document.createElement('canvas');cv.width=cv.height=size;
  const cx=cv.getContext('2d');
  const g=cx.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
  stops.forEach(([t,c])=>g.addColorStop(t,c));
  cx.fillStyle=g;cx.fillRect(0,0,size,size);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({
    map:new THREE.CanvasTexture(cv),
    transparent:true,blending,depthWrite:false,opacity
  }));
  sp.scale.set(scl,scl,1);
  sp.position.set(px,py,pz);
  return sp;
}

// tight core glow
scene.add(radialSprite(256,
  [[0,'rgba(255,90,155,0.78)'],[0.28,'rgba(220,30,120,0.38)'],[0.6,'rgba(160,0,100,0.14)'],[1,'rgba(0,0,0,0)']],
  THREE.AdditiveBlending,0.82,115,0,14,-1));

// wide soft bloom
scene.add(radialSprite(256,
  [[0,'rgba(255,60,130,0.26)'],[0.45,'rgba(180,0,100,0.09)'],[1,'rgba(0,0,0,0)']],
  THREE.AdditiveBlending,0.85,190,0,14,-3));

/* ════════════════════════════════════════════════════════════
   NEBULA SPRITE  (fades in when zoomed out)
═══════════════════════════════════════════════════════════ */
let nebula;
{
  const cv=document.createElement('canvas');cv.width=cv.height=512;
  const cx=cv.getContext('2d');
  const g=cx.createRadialGradient(256,256,0,256,256,256);
  g.addColorStop(0,  'rgba(255,110,195,0.68)');
  g.addColorStop(0.18,'rgba(190,35,140,0.42)');
  g.addColorStop(0.45,'rgba(90,8,130,0.18)');
  g.addColorStop(1,  'rgba(0,0,0,0)');
  cx.fillStyle=g;cx.fillRect(0,0,512,512);
  // spiral arms
  for(let a=0;a<5;a++){
    const ang=(a/5)*Math.PI*2;
    const gx=cx.createRadialGradient(
      256+Math.cos(ang)*115,256+Math.sin(ang)*115,0,
      256+Math.cos(ang)*115,256+Math.sin(ang)*115,140
    );
    gx.addColorStop(0,'rgba(255,100,190,0.20)');
    gx.addColorStop(1,'rgba(0,0,0,0)');
    cx.fillStyle=gx;cx.fillRect(0,0,512,512);
  }
  nebula=new THREE.Sprite(new THREE.SpriteMaterial({
    map:new THREE.CanvasTexture(cv),
    transparent:true,blending:THREE.AdditiveBlending,
    depthWrite:false,opacity:0
  }));
  nebula.scale.set(720,720,1);
  nebula.position.set(0,14,-260);
  scene.add(nebula);
}

/* ════════════════════════════════════════════════════════════
   STAR FIELD  (two shells for depth parallax)
═══════════════════════════════════════════════════════════ */
function starField(n,rMin,rMax,ptSize){
  const g=new THREE.BufferGeometry();
  const p=new Float32Array(n*3),c=new Float32Array(n*3);
  const pal=[
    new THREE.Color(0xffffff),new THREE.Color(0xffd6ee),
    new THREE.Color(0xaaccff),new THREE.Color(0xffeedd),new THREE.Color(0xffbbdd)
  ];
  for(let i=0;i<n;i++){
    const r=rMin+Math.random()*(rMax-rMin);
    const th=Math.random()*Math.PI*2,ph=Math.acos(2*Math.random()-1);
    p[i*3  ]=r*Math.sin(ph)*Math.cos(th);
    p[i*3+1]=r*Math.sin(ph)*Math.sin(th);
    p[i*3+2]=r*Math.cos(ph);
    const cl=pal[Math.floor(Math.random()*pal.length)];
    c[i*3]=cl.r;c[i*3+1]=cl.g;c[i*3+2]=cl.b;
  }
  g.setAttribute('position',new THREE.BufferAttribute(p,3));
  g.setAttribute('color',   new THREE.BufferAttribute(c,3));
  return new THREE.Points(g,new THREE.PointsMaterial({
    map:starTex,size:ptSize,vertexColors:true,
    transparent:true,opacity:0.80,depthWrite:false,
    sizeAttenuation:true,alphaTest:0.03
  }));
}
scene.add(starField(1600,180,650,0.85));
scene.add(starField(900, 650,1600,1.35));

/* ════════════════════════════════════════════════════════════
   DOM TITLE
═══════════════════════════════════════════════════════════ */
const anitaEl=document.getElementById('anita');

/* ════════════════════════════════════════════════════════════
   ANIMATION LOOP
═══════════════════════════════════════════════════════════ */
const SWIRL=0.016; // arc-fraction per second
let lastTs=0;

function animate(ts){
  requestAnimationFrame(animate);
  const dt=Math.min((ts-lastTs)/1000,0.05);
  lastTs=ts;
  const T=ts*0.001;

  // Swirl + float outline particles
  for(let i=0;i<OUTLINE_N;i++){
    baseU[i]=(baseU[i]+SWIRL*dt)%1;
    const p=onLUT(LUT,baseU[i]);
    const wave =Math.sin(T*0.88+phase[i])*0.42;
    const perp =Math.cos(T*0.60+phase[i])*0.16;
    posAttr.array[i*3  ]=p.x*SC+perp;
    posAttr.array[i*3+1]=p.y*SC+wave;
    posAttr.array[i*3+2]=Math.sin(T*0.52+phase[i])*0.32;
    // sparkle brightness
    const spark=0.70+0.30*Math.sin(T*2.2+phase[i]);
    const c=heartCol(baseU[i],spark);
    col[i*3]=c.r;col[i*3+1]=c.g;col[i*3+2]=c.b;
  }
  // Sparkle-only particles: pulse in place
  for(let i=OUTLINE_N;i<TOTAL;i++){
    const spark=0.45+0.55*Math.abs(Math.sin(T*3.0+phase[i]));
    const c=heartCol(baseU[i],spark);
    col[i*3]=c.r;col[i*3+1]=c.g;col[i*3+2]=c.b;
    posAttr.array[i*3+1]+=Math.sin(T*1.05+phase[i])*0.007;
  }
  posAttr.needsUpdate=true;
  geo.attributes.color.needsUpdate=true;

  // Camera-distance based effects
  const dist=camera.position.distanceTo(controls.target);
  nebula.material.opacity=THREE.MathUtils.clamp((dist-95)/175,0,0.70);
  if(dist>52) anitaEl.classList.add('show');
  else        anitaEl.classList.remove('show');

  controls.update();
  renderer.render(scene,camera);
}

setTimeout(()=>document.getElementById('hint').classList.add('hide'),5500);
animate(0);
})();
</script>
</body>
</html>
